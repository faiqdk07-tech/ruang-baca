<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ruang Baca</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Ruang Baca</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: bingkai seukuran iPad landscape; sidebar kaca (HP: tab bar bawah). Halaman baca = kertas polos dua kolom ala Kindle, deretan halaman mini di bawah */
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --ink:#2A2A2C; --muted:#8A8A8F; --line:rgba(0,0,0,.08);
  --glass:rgba(255,255,255,.55); --glass-2:rgba(255,255,255,.78); --glass-line:rgba(255,255,255,.7);
  --accent:#C9822B; --accent-soft:rgba(201,130,43,.12); --ok:#34A853; --ok-soft:rgba(52,168,83,.12); --no:#D9483B; --no-soft:rgba(217,72,59,.1);
  --mark:rgba(255,214,102,.45); --thumb:#C9C9CC;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --read:"Literata","Iowan Old Style",Georgia,serif;
  --fs:17px; --fsq:15px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101012; --paper:#1C1C1E; --ink:#E6E4DF; --muted:#8E8E93; --line:rgba(255,255,255,.08);
  --glass:rgba(44,44,48,.55); --glass-2:rgba(58,58,62,.75); --glass-line:rgba(255,255,255,.1);
  --accent:#E0A050; --accent-soft:rgba(224,160,80,.16); --ok:#4CC172; --ok-soft:rgba(76,193,114,.14); --no:#F07065; --no-soft:rgba(240,112,101,.14);
  --mark:rgba(224,170,60,.28); --thumb:#3A3A3E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101012; --paper:#1C1C1E; --ink:#E6E4DF; --muted:#8E8E93; --line:rgba(255,255,255,.08);
  --glass:rgba(44,44,48,.55); --glass-2:rgba(58,58,62,.75); --glass-line:rgba(255,255,255,.1);
  --accent:#E0A050; --accent-soft:rgba(224,160,80,.16); --ok:#4CC172; --ok-soft:rgba(76,193,114,.14); --no:#F07065; --no-soft:rgba(240,112,101,.14);
  --mark:rgba(224,170,60,.28); --thumb:#3A3A3E; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* frame (iPad) */
.frame{max-width:1180px;height:min(820px,calc(100vh - 48px));min-height:560px;margin:0 auto;background:var(--paper);border-radius:28px;box-shadow:0 30px 60px rgba(0,0,0,.14),0 0 0 1px var(--line);position:relative;overflow:hidden;display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
#ov{display:contents}
.frame::before{content:none}
.frame.full{grid-template-columns:minmax(0,1fr)}
.frame.full .side{display:none}

/* glass sidebar */
.side{position:relative;margin:16px 0 16px 16px;border-radius:20px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:inset 0 0 0 1px var(--glass-line),0 8px 24px rgba(0,0,0,.05);display:flex;flex-direction:column;padding:18px 12px}
.hello{padding:4px 8px 22px}
.hello small{display:block;color:var(--muted);font-size:12px}
.hello b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;color:var(--ink);text-decoration:none;font-weight:500;font-size:14px}
.nav a svg{width:18px;height:18px;color:var(--muted)}
.nav a[aria-current="page"]{background:var(--glass-2);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.side-f{margin-top:auto;padding:0 8px;font-size:11px;color:var(--muted);display:grid;gap:10px}
.thm{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink);padding:8px 10px;border-radius:11px;background:rgba(120,120,128,.1)}.thm svg{width:17px;height:17px;flex:none}
@media (max-width:600px){.thm{justify-content:center;padding:10px 0}}

.main{position:relative;min-width:0;overflow:auto;padding:34px 40px 40px}
.h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0}
.lead{color:var(--muted);margin:4px 0 26px;font-size:14px}

/* paket list */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px}
.pk{text-align:left;display:grid;gap:10px}
.cover{aspect-ratio:3/4;border-radius:6px 12px 12px 6px;background:var(--c);position:relative;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.14),inset 5px 0 0 rgba(0,0,0,.14);transition:transform .25s cubic-bezier(.2,.7,.2,1);padding:16px 14px;display:flex;flex-direction:column;justify-content:flex-end;color:rgba(255,255,255,.95)}
.cover b{font-family:var(--read);font-size:19px;font-weight:500;line-height:1.15}
.cover small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;position:absolute;top:16px;left:14px}
.pk:hover .cover{transform:translateY(-4px)}
.pk-t{font-weight:600;font-size:14px}.pk-s{color:var(--muted);font-size:12px}
.pk.ghost .cover{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.pk.ghost{cursor:default}.pk.ghost:hover .cover{transform:none}

/* glass sheet */
.scrim{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.28);display:grid;place-items:center;padding:20px;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet{width:min(420px,100%);border-radius:24px;background:color-mix(in srgb,var(--paper) 96%,transparent);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:inset 0 0 0 1px var(--glass-line),0 24px 50px rgba(0,0,0,.2);padding:22px;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.96);opacity:.5}}
.sheet h3{margin:0;font-size:20px;letter-spacing:-.01em}
.sheet p{margin:4px 0 16px;color:var(--muted)}
.toc{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:0}
.toc li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toc li span:first-child{font-family:var(--read);font-size:15px}
.toc li span:last-child{color:var(--muted);font-size:12px;white-space:nowrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:2px;border-radius:10px;background:rgba(120,120,128,.14);margin-bottom:16px}
.seg button{padding:7px 10px;border-radius:8px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.btn-p{background:var(--ink);color:var(--paper)}
.btn-g{background:rgba(120,120,128,.14)}
.btn[disabled]{opacity:.35;cursor:default}

/* reader (Kindle) */
.rd{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100%;padding:24px 44px 18px}
.rd-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;margin-bottom:22px}
.circ{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;background:rgba(120,120,128,.16)}
.circ svg{width:16px;height:16px;color:var(--ink)}
.crumb{display:flex;align-items:baseline;gap:14px;min-width:0;white-space:nowrap;overflow:hidden}
.crumb span{font-size:13px;color:var(--ink);opacity:.8;overflow:hidden;text-overflow:ellipsis}
.crumb i{font-style:normal;font-weight:600;opacity:.9}
.crumb b{font-family:var(--read);font-weight:500;font-size:17px;overflow:hidden;text-overflow:ellipsis}
.pg{font-family:var(--read);font-size:17px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:14px}
.ibtn{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;flex:none}
.ibtn:hover{background:rgba(120,120,128,.14)}
.ibtn svg{width:18px;height:18px}
.rd-body{overflow:auto;min-height:0;padding-right:6px}
.prose{font-family:var(--read);font-size:var(--fs);line-height:1.68;color:var(--ink)}
.cols{column-count:2;column-gap:48px}
.para{margin:0 0 1em;break-inside:avoid-column;position:relative;border-radius:4px;transition:background .3s,box-shadow .3s}
.pn{display:none!important}
.para.li p{padding-left:1.1em;text-indent:-1.1em}
.para .pn{position:absolute;left:-20px;top:.3em;font-family:var(--ui);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.para p{margin:0}
.para.hl{background:var(--mark);box-shadow:0 0 0 6px var(--mark)}
.subh{font-family:var(--read);font-size:1.05em;font-weight:600;margin:1.2em 0 .5em;break-after:avoid}
.src{font-family:var(--ui);font-size:11px;color:var(--muted);margin-top:6px}
.tbl{break-inside:avoid;margin:2px 0 1.1em;font-family:var(--ui);font-size:12.5px;font-variant-numeric:tabular-nums;overflow-x:auto}
.tbl .cap{font-weight:600;margin-bottom:4px}
.tbl table{border-collapse:collapse;width:100%}
.tbl th,.tbl td{text-align:left;padding:5px 8px 5px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--muted);font-weight:500}
.stanza{display:block}.stanza span{display:block}
.post{break-inside:avoid;margin:0 0 1.1em}
.post-h{font-family:var(--ui);font-size:12.5px;display:flex;gap:8px;align-items:baseline}
.post-h b{font-weight:700}.post-h small{color:var(--muted)}
.post.op .post-h b{color:var(--accent)}
.blank{font-family:var(--ui);font-size:.8em;font-weight:600;padding:1px 7px;border-radius:6px;background:rgba(120,120,128,.14);white-space:nowrap}
.blank.active{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* page strip */
.strip{margin-top:16px;border-radius:20px;background:rgba(120,120,128,.12);padding:12px 18px;display:flex;align-items:center;gap:14px;min-height:96px}
.thumbs{flex:1;display:flex;gap:14px;overflow-x:auto;min-width:0;padding:10px 4px 4px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.th{flex:none;width:52px;height:68px;border-radius:7px;background:var(--thumb);position:relative;display:grid;place-items:end center;padding-bottom:6px;font-weight:700;font-size:15px;color:rgba(255,255,255,.95);overflow:hidden;transition:transform .2s}
.th::before{content:"";position:absolute;inset:8px 7px 24px;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1.5px,transparent 1.5px 4px);opacity:.6}
.th[aria-current="true"]{background:var(--paper);color:var(--ink);transform:translateY(-6px) scale(1.1);box-shadow:0 10px 20px rgba(0,0,0,.16)}
.th.q{background:var(--paper);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);width:40px;height:40px;border-radius:12px;place-items:center;padding:0;font-size:13px}
.th.q::before{display:none}
.th.q.ans{background:var(--ink);color:var(--paper);box-shadow:none}
.th.q.flg{background:var(--accent);color:#fff;box-shadow:none}
.th.q[aria-current="true"]{transform:translateY(-3px);box-shadow:0 0 0 2px var(--ink),0 8px 16px rgba(0,0,0,.12)}

/* quiz */
.qz{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;min-height:0;overflow:hidden}
.qz .left{overflow:auto;min-height:0;padding:0 6px 0 0;position:relative}
.qz .left .prose{font-size:var(--fsq);line-height:1.62}.qz .left .para{margin-bottom:.75em}
.fsz{margin-left:auto;display:flex;gap:4px}.fsz button{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(120,120,128,.1)}
.qz .right{overflow:auto;min-height:0;padding-right:6px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{font-size:12px;padding:4px 10px;border-radius:999px;color:var(--muted);background:rgba(120,120,128,.1)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ttl{font-family:var(--read);font-size:20px;font-weight:500;margin:0 0 12px}
.stem{font-family:var(--read);font-size:18px;line-height:1.55;margin:0 0 18px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;text-align:left;padding:11px 14px;border-radius:14px;background:rgba(120,120,128,.08);transition:background .15s}
.opt:hover{background:rgba(120,120,128,.14)}
.opt .L{font-weight:700;font-size:13px;color:var(--muted);padding-top:1px}
.opt .tx{font-size:14.5px}
.opt.sel{background:var(--ink);color:var(--paper)}.opt.sel .L{color:var(--paper);opacity:.7}
.opt.ok{background:var(--ok-soft);box-shadow:inset 0 0 0 1.5px var(--ok)}.opt.ok .L{color:var(--ok)}
.opt.no{background:var(--no-soft);box-shadow:inset 0 0 0 1.5px var(--no)}.opt.no .L{color:var(--no)}
.opt[disabled]{cursor:default}
.note{margin-top:16px;padding:14px 16px;border-radius:14px;background:rgba(120,120,128,.08);display:grid;gap:8px;font-size:13.5px}
.note b.v{font-size:15px}.note b.v.ok{color:var(--ok)}.note b.v.no{color:var(--no)}
.quote{font-family:var(--read);font-style:italic}
.dist{margin:0;padding-left:16px;color:var(--muted)}
.mtab{display:none}

/* progress & result */
.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:30px}
.tile{border-radius:18px;padding:16px 18px;background:rgba(120,120,128,.08)}
.tile .n{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:12px}
.h2{font-size:17px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 40px;margin-bottom:30px}
.sk{display:grid;grid-template-columns:minmax(0,1fr) 90px 36px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.sk span{font-size:13.5px}.sk em{font-style:normal;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.meter{height:4px;border-radius:99px;background:rgba(120,120,128,.18);overflow:hidden}
.meter b{display:block;height:100%;background:var(--ink);border-radius:99px}
.meter b.low{background:var(--no)}
.hist{display:grid}
.hist div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.hist div span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:12px 0;margin:0 0 20px}
.score{display:flex;align-items:baseline;gap:12px;margin:4px 0 26px}
.score .n{font-family:var(--read);font-size:64px;font-weight:500;line-height:1;letter-spacing:-.02em}
.score .s{color:var(--muted)}
.rv{border-bottom:1px solid var(--line)}
.rv-h{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:12px 0}
.rv-h .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.rv-h .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.no{background:var(--no-soft);color:var(--no)}.tag.sk{background:rgba(120,120,128,.12);color:var(--muted)}
.rv-b{padding:0 0 14px 42px}.rv-b .note{margin:0}


/* tambah paket */
.warn{background:var(--accent-soft);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:13px;margin:0 0 18px}
.fld{display:grid;gap:6px;margin:0 0 18px;max-width:420px}.fld span{font-size:12px;color:var(--muted);font-weight:600}
input,textarea{font:inherit;color:var(--ink);background:rgba(120,120,128,.08);border:1px solid transparent;border-radius:12px;padding:10px 12px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--paper)}
textarea{min-height:110px;resize:vertical;font-family:var(--read);font-size:14.5px;line-height:1.55}
.slots{display:grid;gap:14px}
.slot{display:grid;gap:8px;padding:14px;border-radius:18px;background:rgba(120,120,128,.05);box-shadow:inset 0 0 0 1px var(--line)}
.slot-h{display:flex;gap:10px;align-items:baseline}.slot-h b{font-size:13px}.slot-h span{font-size:13px;color:var(--muted)}
.st{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted)}.st.ok{color:var(--ok)}.st.gagal{color:var(--no)}.st.proses{color:var(--accent)}
.slot-f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slot-f input{font-size:13px;padding:8px 10px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0}
.imp{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.prev{margin-top:20px;padding:16px;border-radius:18px;background:var(--ok-soft)}
.pv{padding:10px 0;border-top:1px solid var(--line)}.pv-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px}.pv-h span{color:var(--muted);font-size:12.5px}
details summary{cursor:pointer;font-size:12.5px;color:var(--accent);margin-top:6px}
.kor{border-collapse:collapse;width:100%;font-size:12px;margin-top:6px}.kor th,.kor td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}.kor tr.miss td{color:var(--no)}
.chart{break-inside:avoid;margin:4px 0 1.1em;font-family:var(--ui);font-size:12.5px}
.chart .cap{font-weight:600;margin-bottom:6px}
.bar-r{display:grid;grid-template-columns:minmax(70px,auto) minmax(0,1fr) 54px;gap:10px;align-items:center;padding:3px 0}
.bar-t{height:10px;border-radius:99px;background:rgba(120,120,128,.14);overflow:hidden}.bar-t b{display:block;height:100%;background:var(--ink);border-radius:99px;opacity:.75}
.bar-r em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:820px){.slot-f{grid-template-columns:1fr}}


/* jadwal */
.jd{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(0,1.3fr);gap:28px;align-items:start}
.day-h{margin-bottom:12px}.day-h h2{font-family:var(--read);font-weight:500;font-size:24px;margin:2px 0 0}.amp{color:var(--accent);font-style:italic}
.smallc{font-size:12px;color:var(--muted);font-weight:600}
.dslots{list-style:none;margin:0 0 16px;padding:0;display:grid}
.dslots li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:5px}
.ds-h{display:flex;gap:8px;font-size:12px}.ds-h span{color:var(--muted)}
.ds-t{font-family:var(--read);font-size:16px}
.ds-r{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipx{font-size:11.5px;padding:4px 10px;border-radius:999px;background:rgba(120,120,128,.1);color:var(--ink);text-decoration:none}
a.chipx:hover{background:var(--accent-soft);color:var(--accent)}
a.chipx.direct{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chipx.cp{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);background:transparent}
a.btn{text-decoration:none;display:inline-block;color:inherit}a.btn-p{color:var(--paper)}
.cal{border-radius:20px;padding:14px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px var(--line);position:sticky;top:0}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.cal-h b{font-size:15px}.cal-h .ibtn{font-size:20px}

function tblHTML(T){return `<div class="tbl"><div class="cap">${esc(T.judul||"")}</div><table><thead><tr>${(T.kolom||[]).map(k=>`<th>${esc(k)}</th>`).join("")}</tr></thead><tbody>${(T.baris||[]).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function chartHTML(G){const v=(G.nilai||[]).map(Number),mx=Math.max(...v,1);return `<div class="chart"><div class="cap">${esc(G.judul||"")}</div>${(G.label||[]).map((l,i)=>`<div class="bar-r"><span>${esc(l)}</span><div class="bar-t"><b style="width:${Math.max(2,v[i]/mx*100)}%"></b></div><em>${esc(v[i])}${esc(G.satuan||"")}</em></div>`).join("")}</div>`}
function teks(t,o={}){
  let h="",placed=false;
  const hit=(n,ps=1)=>!!o.hl&&Number(o.hl.paragraf)===n&&Number(o.hl.passage||1)===ps;
  const paraList=(arr,ps)=>{let k=0,x="";arr.forEach(p=>{
    p=String(p);
    if(p.startsWith("## ")){x+=`<h3 class="subh">${esc(p.slice(3))}</h3>`;return}
    const i=k++;
    const li=/^[*\-•]\s+/.test(p);if(li)p="• "+p.replace(/^[*\-•]\s+/,"");
    const body=esc(p).replace(/\{\{(\d+)\}\}/g,(m,n)=>{const s=pk()?.soal.find(q=>q.no==n),a=S.ans[n];return `<span class="blank${+n===o.blank?" active":""}">(${n}) ${a&&s?esc(s.opsi[a]):"……"}</span>`});
    x+=`<div class="para${li?" li":""}${hit(i+1,ps)?" hl":""}"><span class="pn">${i+1}</span><p>${body}</p></div>`;
    if(t.tabel&&ps===1&&Number(t.tabel.setelah)===i+1){x+=tblHTML(t.tabel);placed=true}
  });return x};
  if(t.jenis==="paired"&&t.passages){t.passages.forEach((P,pi)=>{h+=`<h3 class="subh">${esc(P.label||"Text "+(pi+1))}</h3>`+paraList(P.paragraf||[],pi+1)})}
  else if(t.jenis==="puisi"&&t.bait){h+=t.bait.map((b,i)=>`<div class="para stanza${hit(i+1)?" hl":""}"><span class="pn">${i+1}</span>${b.map(l=>`<span>${esc(l)}</span>`).join("")}</div>`).join("")}
  else if(t.jenis==="thread"&&t.posts){h+=t.posts.map((p,i)=>`<div class="para post${i===0?" op":""}${hit(i+1)?" hl":""}"><span class="pn">${i+1}</span><div class="post-h"><b>${esc(p.nama)}</b><small>${esc(p.tanggal||"")}</small></div><p>${esc(p.isi)}</p></div>`).join("")}
  else{h+=paraList(t.paragraf||[],1)}
  if(t.tabel&&!placed)h+=tblHTML(t.tabel);
  if(t.grafik)h+=chartHTML(t.grafik);
  if(t.sumber)h+=`<div class="src">${esc(t.sumber)}</div>`;
  return `<div class="prose${o.cols?" cols":""}">${h}</div>`;
}

/* ===== HASIL ===== */
function vResult(){
  const p=pk(),n=p.soal.length,b=p.soal.filter(s=>S.ans[s.no]===s.kunci).length;
  const by={};p.soal.forEach(s=>{(by[s.label]=by[s.label]||{n:0,b:0}).n++;if(S.ans[s.no]===s.kunci)by[s.label].b++});
  if(!S.saved){const H=getHist();H[p.paket_id]={sub:p.subtes,judul:p.judul_paket,b,n,by,t:S.el,d:Date.now()};setHist(H);clearSesi();S.saved=true}
  main(`<button class="circ" id="bk" aria-label="Kembali" style="margin-bottom:18px">${I.back}</button>
   <div class="lead" style="margin:0">${esc(p.judul_paket)} · ${fmt(S.el)}</div>
   <div class="score"><span class="n">${b}/${n}</span><span class="s">jawaban tepat</span></div>
   <h2 class="h2">Per tipe soal</h2>
   <div class="skills">${Object.entries(by).sort((x,y)=>x[1].b/x[1].n-y[1].b/y[1].n).map(([k,v])=>{const r=Math.round(v.b/v.n*100);return `<div class="sk"><span>${esc(LABELS[k])}</span><div class="meter"><b class="${r<60?"low":""}" style="width:${r}%"></b></div><em>${r}%</em></div>`}).join("")}</div>
   <h2 class="h2">Pembahasan</h2>
   <div>${p.soal.map((s,i)=>{const a=S.ans[s.no],st=!a?"sk":a===s.kunci?"ok":"no";return `<div class="rv"><button class="rv-h" data-o="${s.no}"><span class="n">${i+1}</span><span class="t">${esc(s.stem)}</span><span class="tag ${st}">${st==="ok"?"Tepat":st==="no"?"Keliru":"Kosong"}</span></button>${S.open[s.no]?`<div class="rv-b">${note(s,a||"-")}</div>`:""}</div>`}).join("")}</div>
   <div class="row" style="margin-top:22px;justify-content:flex-start"><button class="btn btn-p" id="hm">Selesai</button><button class="btn btn-g" id="ag">Ulangi</button></div>`);
  const home=()=>{S.view="page";S.page=p.subtes==="LBIND"?"indonesia":"inggris";render()};
  $("#bk").onclick=home;$("#hm").onclick=home;
  $("#ag").onclick=()=>{Object.assign(S,{r:0,q:0,ans:{},flag:{},open:{},el:0,saved:false,view:"read"});render()};
  $$("[data-o]").forEach(x=>x.onclick=()=>{S.open[x.dataset.o]=!S.open[x.dataset.o];const st=$("#main").scrollTop;vResult();$("#main").scrollTop=st});
}

/* ===== PROGRES ===== */
function vProg(){
  const H=Object.values(getHist());
  const sum=sub=>{const agg={};H.filter(h=>h.sub===sub).forEach(h=>Object.entries(h.by).forEach(([k,v])=>{agg[k]=agg[k]||{b:0,n:0};agg[k].b+=v.b;agg[k].n+=v.n}));return agg};
  const avg=H.length?Math.round(H.reduce((a,h)=>a+h.b/h.n,0)/H.length*100):0;
  const block=(sub,title)=>{const e=Object.entries(sum(sub));return `<h2 class="h2">${title}</h2>${e.length?`<div class="skills">${e.sort((x,y)=>x[1].b/x[1].n-y[1].b/y[1].n).map(([k,v])=>{const r=Math.round(v.b/v.n*100);return `<div class="sk"><span>${esc(LABELS[k])}</span><div class="meter"><b class="${r<60?"low":""}" style="width:${r}%"></b></div><em>${r}%</em></div>`}).join("")}</div>`:`<p class="empty">Belum ada paket ${title} yang selesai.</p>`}`};
  main(`<h1 class="h1">Progres</h1><p class="lead">Ringkasan dari paket yang sudah kamu kumpulkan.</p>
   <div class="big"><div class="tile"><div class="n">${H.length}</div><div class="l">paket selesai</div></div><div class="tile"><div class="n">${H.length?avg+"%":"—"}</div><div class="l">rata-rata benar</div></div><div class="tile"><div class="n">${H.reduce((a,h)=>a+h.n,0)}</div><div class="l">soal dikerjakan</div></div></div>
   ${block("LBIND","Bahasa Indonesia")}${block("LBE","Bahasa Inggris")}
   <h2 class="h2">Riwayat</h2><div class="hist">${H.length?H.sort((a,b)=>b.d-a.d).map(h=>`<div><span>${esc(h.judul)}</span><span>${h.b}/${h.n} · ${fmt(h.t)}</span></div>`).join(""):`<p class="empty">Riwayat akan muncul setelah kamu mengumpulkan paket pertama.</p>`}</div>`);
}

const R02="# KONTEKS PROYEK \u2014 Pola Soal Literasi UTBK-SNBT 2025\u20132026\n\nDisusun dari analisis: KatKiel Project 2026 (Literasi Indonesia 32 teks/156 soal; Literasi Inggris 11 teks/65 soal), TO MIPY #1 & #2 2027 (Literasi Indonesia, masing-masing 30 soal/8 teks), dan Prosus INTEN LBE Tambahan UTBK 2026 Set 1 & 2 (masing-masing 20 soal).\n\n---\n\n## BAGIAN A \u2014 ATURAN BERSAMA\n\n### A1. Format soal\n- 5 opsi A\u2013E, satu kunci.\n- Stem yang berakhir \"adalah \u2026.\" / \"is to \u2026.\" \u2192 opsi berupa **frasa huruf kecil tanpa titik** yang melanjutkan stem.\n- Stem berbentuk pertanyaan (\"Mengapa \u2026?\", \"Which of the following \u2026?\") \u2192 opsi berupa **kalimat lengkap** (huruf kapital, boleh diakhiri titik).\n- Opsi dua lapis \"jawaban + karena alasan\" (mis. \"lokasi 1 karena \u2026\"): kedua bagian harus benar agar opsi menjadi kunci.\n- Format negatif \"kecuali / BUKAN / NOT\" maksimal 2 soal per paket. Kata negatifnya ditulis tebal atau kapital.\n\n### A2. Prinsip kunci\n- Kunci = **parafrase** isi teks: kata kunci diganti sinonim, struktur kalimat diubah (contoh: \"mengintegrasikan sistem pengawasan\" \u2192 \"menyatukan sistem pengawasan yang sebelumnya terpisah\"; \"How can people constantly \u2026\" \u2192 \"Finding ways for continuous \u2026\").\n- Kunci harus **menjawab persis yang ditanyakan**, sesuai cakupan (tujuan \u2260 detail, gagasan utama \u2260 satu detail).\n- Kunci boleh memakai bahasa hati-hati (\"possible\", \"cenderung\", \"dapat\") ketika soal meminta penjelasan yang paling mungkin.\n\n### A3. Katalog distraktor (pakai minimal 2 jenis per soal)\n| Kode | Jebakan | Contoh pola |\n|---|---|---|\n| D1 | **Benar tapi tidak menjawab** | Fakta lain dari teks (fasilitas pengaduan OJK) dipakai untuk menjawab \"tujuan pembentukan OJK\" |\n| D2 | **Kata absolut / generalisasi** | selalu, semua, seluruh, sepenuhnya, permanen, langsung menghentikan; fully, entirely, only, without any drawbacks, identical |\n| D3 | **Arah/sebab-akibat terbalik** | \"dari potensial rendah ke tinggi\"; akibat ditulis sebagai sebab |\n| D4 | **Detail salah tempat** | informasi dari paragraf/teks lain dipasang pada konteks yang salah |\n| D5 | **Cakupan salah** | terlalu luas (\"wide applications in electronic goods\") atau terlalu sempit (hanya satu detail) |\n| D6 | **Tidak disebut di teks** | masuk akal secara umum, tapi tidak ada dasarnya di teks |\n| D7 | **Satu kata kunci diganti** | continuous \u2192 occasional/spontaneous; finding ways \u2192 suggesting tips |\n| D8 | **Makna harfiah/umum** | makna kamus padahal yang ditanya makna kontekstual; tafsir puisi terlalu harfiah (luka = penyakit fisik) |\n| D9 | **Tafsir ekstrem** | watak \"sarkastik/emosional\", sikap \"menyalahkan\", tone \"aggressive\" padahal teks moderat |\n| D10 | **Sinonim berdekatan** | Concerned vs Anxious; practicality vs sustainability; avoid vs limit |\n| D11 | **Bertentangan dengan data** | klaim urutan/selisih yang tidak sesuai tabel/grafik; \"semua kategori sama\" |\n| D12 | **Modalitas/subjek diubah** | may happen \u2192 there is; menambah \"totally\"; menukar pelaku |\n\n### A4. Level\n- **LOTS**: informasi tersurat, definisi, referensi.\n- **MOTS**: makna kontekstual, sebab-akibat, restatement, gagasan utama, baca data.\n- **HOTS**: penerapan ke kasus baru, asumsi, inferensi/prediksi, evaluasi teks, sintesis dua teks, hitungan lanjutan.\n- Sebaran per paket: \u00b120% LOTS, \u00b150% MOTS, \u00b130% HOTS.\n\n### A5. Pembahasan\nFormat tiap soal:\n```\nNo. n \u2014 Kunci: X  [Label | Level]\nBukti: Paragraf p \u2014 \"kutipan pendek\"\nAlasan: 1\u20132 kalimat mengapa X benar.\nDistraktor: A (D2) \u2026; B (D1) \u2026; C (D6) \u2026; D (D4) \u2026   \u2190 satu frasa per opsi salah\n```\n\n---\n\n## BAGIAN B \u2014 LITERASI DALAM BAHASA INDONESIA (/LBIND)\n\n### B1. Struktur paket: 5 teks \u00d7 5 soal = 25 soal\n| Slot | Bidang | Ciri wajib |\n|---|---|---|\n| T1 | Sains (fisika/kimia/biologi) | Ada rumus atau data angka. Minimal 1 soal ID-09 (hitungan) atau ID-10 (pengetahuan di luar teks). |\n| T2 | Sosial-ekonomi | Ada tabel atau grafik. Minimal 1 soal ID-09. |\n| T3 | Sejarah/humaniora/sosiologi | Minimal 1 soal ID-05 (penerapan konsep ke kasus baru). |\n| T4 | Kesehatan/lingkungan/kebijakan | Minimal 1 soal ID-06 atau ID-08. |\n| T5 | Sastra | Puisi atau kutipan prosa (bergantian antarpaket). |\n\nJumlah soal ID-10 dalam satu paket: 1\u20132. Kalau satu soal ID-10, tambahkan catatan di pembahasan: \"Soal ini menuntut pengetahuan di luar teks.\"\n\n### B2. Teks\n- Nonsastra: 3\u20135 paragraf, 280\u2013450 kata, gaya artikel populer/ensiklopedis/berita sains. Di bawah teks: \"(Diadaptasi dari \u2026)\" atau \"(Diadaptasi dari berbagai sumber)\".\n- Tabel/grafik ditulis sebagai tabel markdown, dengan judul dan satuan.\n- Sastra: puisi 3\u20135 bait atau kutipan prosa 250\u2013400 kata, dengan nama karya/pengarang di bawahnya (kalau orisinal: \"Puisi orisinal\").\n\n### B3. Sebaran soal\n**Teks nonsastra (5 soal):**\n1. ID-01 informasi tersurat (LOTS)\n2. ID-02 makna istilah/ungkapan (MOTS)\n3. ID-03 atau ID-04 sebab-akibat/inferensi (MOTS\u2013HOTS)\n4. ID-05 / ID-06 / ID-08 penerapan, asumsi, atau evaluasi (HOTS)\n5. Bergilir: ID-07 / ID-09 / ID-10 / ID-08\n\n**Teks sastra (5 soal):** maksud kutipan/larik (ID-02), watak/sikap/suasana (ID-11), majas & fungsinya atau citraan (ID-12), efek diksi/alasan tindakan tokoh (ID-12/ID-11), amanat/nilai (ID-07).\n\n### B4. Label & template stem\n| Label | Nama | Template stem (contoh pola asli) |\n|---|---|---|\n| ID-01 | Informasi tersurat | \"Berdasarkan bacaan, tujuan utama dibentuknya \u2026 adalah \u2026.\" / \"Pernyataan yang sesuai dengan teks di atas adalah \u2026.\" |\n| ID-02 | Makna kata, istilah, ungkapan | \"Berdasarkan bacaan, istilah *\u2026* bermakna \u2026.\" / \"Maksud ungkapan '\u2026' dalam bacaan adalah \u2026.\" |\n| ID-03 | Sebab-akibat & alasan | \"Mengapa \u2026 tetap dikategorikan \u2026?\" / \"Berdasarkan bacaan, penyebab \u2026 adalah \u2026.\" |\n| ID-04 | Inferensi & prediksi | \"Apa yang mungkin terjadi jika \u2026?\" / \"Jika \u2026, kemungkinan yang dapat terjadi adalah \u2026.\" |\n| ID-05 | Penerapan konsep | \"Manakah fenomena berikut yang berada pada tahap \u2026?\" / \"Sebuah produk \u2026. Produk tersebut tergolong \u2026.\" / \"\u2026 yang berpikir pada tahap \u2026 akan mengartikan fenomena tersebut sebagai \u2026.\" |\n| ID-06 | Asumsi & argumen | \"Manakah asumsi yang paling logis terkait \u2026?\" / \"Perhatikan kalimat berikut! \u2026 Manakah argumen paling logis terkait pernyataan tersebut?\" |\n| ID-07 | Gagasan utama, tujuan, pesan | \"Inti permasalahan yang dibahas pada paragraf ketiga adalah \u2026.\" / \"Tujuan penulisan paragraf ke-4 adalah \u2026.\" / \"Pesan penting yang dapat diambil \u2026\" |\n| ID-08 | Evaluasi teks | \"Berikut ini yang menunjukkan kekurangan/kelebihan bacaan tersebut adalah \u2026.\" / \"Manakah fenomena yang paling menggambarkan kelemahan teori \u2026?\" |\n| ID-09 | Data visual & hitungan | \"Berdasarkan tabel, \u2026\" / \"Persentase \u2026 terhadap \u2026 adalah sekitar \u2026.\" / \"Berdasarkan bacaan, interval kontur pada peta tersebut adalah \u2026.\" |\n| ID-10 | Pengetahuan di luar teks | Teks menyebut konsep \u2192 soal meminta rumus/simbol/konsekuensi ilmiah (MgCl\u2082 dari \"magnesium klorida\"; salinitas tinggi \u2192 tekanan uap lebih rendah; hambatan 2\u00d7 \u2192 arus \u00bd) |\n| ID-11 | Sastra: tokoh, sikap, suasana | \"Penggambaran watak tokoh \u2026 yang paling sesuai \u2026\" / \"Suasana yang berkembang dari awal hingga akhir \u2026\" / \"Sikap penyair terhadap \u2026\" |\n| ID-12 | Sastra: majas, diksi, citraan | \"Majas yang digunakan \u2026 adalah \u2026.\" / \"Penggunaan ungkapan '\u2026' dibandingkan kata '\u2026' bertujuan untuk \u2026.\" / \"Larik \u2026 memiliki kesamaan pola majas dengan kalimat \u2026.\" |\n\n### B5. Catatan khas Literasi Indonesia\n- Opsi angka hasil hitungan: kunci + distraktor dari kesalahan hitung yang lazim (salah penyebut, lupa konversi satuan, \u00d710 atau \u00f710).\n- Penerapan konsep: kasusnya **baru** (tidak ada di teks), tapi kriterianya ada di teks.\n- Opsi sastra: hindari tafsir yang bisa diperdebatkan. Kunci harus didukung larik/kalimat yang bisa ditunjuk.\n\n---\n\n## BAGIAN C \u2014 LITERASI DALAM BAHASA INGGRIS (/LBE)\n\n### C1. Struktur paket: 20 soal\n| Bagian | Bentuk teks | Soal |\n|---|---|---|\n| A | **Forum thread**: pembuka (nama + tanggal + pertanyaan), lalu 5\u20136 balasan (nama + tanggal). Satu balasan wajib tidak relevan (iklan/off-topic). Satu balasan memberi tip **dengan bukti** pengalaman/hasil. Satu balasan **berbeda pendapat** secara eksplisit. | 4 |\n| B | **Paired texts**: Text 1 & Text 2 (atau Passage 1 & 2), masing-masing 2\u20134 paragraf, 150\u2013250 kata. Hubungan khas: masalah \u2194 solusi, umum \u2194 khusus, pro \u2194 kontra, konsep A \u2194 konsep B. | 4 |\n| C | **Text + chart**: 1\u20132 paragraf pengantar dan grafik (tabel data: kategori, nilai, satuan) dengan pola yang jelas (naik/turun bertahap, satu selisih terbesar). | 4 |\n| D | **Cloze**: satu teks 3\u20135 paragraf dengan 8 titik `(n) \u2026\u2026`. Boleh berupa deskripsi grafik (*The bar chart (n) \u2026\u2026 the percentage of \u2026*). | 8 |\n\n### C2. Sebaran soal reading\n- **A (thread):** EN-09 issue at the beginning, EN-09 who \u2026?, EN-05 purpose of X's post / EN-09 least relevant answer, EN-06 tone / EN-03 vocabulary.\n- **B (paired):** EN-07 relationship/difference/synthesis, EN-01 detail, EN-02 reference / EN-03 vocabulary / EN-04 restatement, EN-06 attitude / EN-08 prediction-recommendation / EN-07 information location.\n- **C (chart):** EN-10 conclusion supported by data, EN-10/EN-08 recommendation from data, EN-08 inference explaining the pattern, EN-10 evaluate differences (gap) / explain the disparity.\n\n### C3. Label & template stem\n| Label | Nama | Template stem |\n|---|---|---|\n| EN-01 | Detail & definition | \"According to Text 1, \u2026 because it \u2026\" / \"According to Passage 1, culture is defined as \u2026\" / \"Which of the following is TRUE about \u2026?\" |\n| EN-02 | Reference | \"The word 'their' in Text 2 Paragraph 2 refers to \u2026\" |\n| EN-03 | Vocabulary in context | \"The word 'X' in \u2026 is closest in meaning to \u2026\" / \"The phrase 'X' in Text 1 Paragraph 5 is similar to \u2026\" |\n| EN-04 | Restatement | \"Which of the following best restates the sentence '\u2026' in Text 2 Paragraph 2?\" |\n| EN-05 | Main idea & purpose | \"Which of the following is the best main idea of Text 1?\" / \"The purpose of Text 2 / of X's post is to \u2026\" |\n| EN-06 | Attitude, tone, fact/opinion | \"Which of the following statements shows the author's negative attitude toward \u2026?\" (opsi = kutipan dari teks) / \"What is the tone of the thread \u2026?\" / \"Which of the following sentences from Text 2 is an opinion?\" |\n| EN-07 | Text relationship & synthesis | \"What is the relationship between Text 1 and Text 2?\" / \"What is the difference between Passage 1 and Passage 2?\" / \"Which \u2026 best synthesizes the key arguments from BOTH passages \u2026?\" / \"Information about \u2026 can be found in \u2026\" (opsi: Text 1 Paragraph x and Text 2 Paragraph y) |\n| EN-08 | Inference, prediction, recommendation | \"Based on the two texts, which of the following will most likely happen in the future?\" / \"\u2026 which of the following recommendations is appropriate \u2026?\" / \"Which inference best explains the pattern \u2026?\" |\n| EN-09 | Thread: issue & who | \"Which of the following is the issue stated at the beginning of the thread?\" / \"Who provides a tip on \u2026 by giving evidence?\" / \"Who explicitly suggests \u2026?\" / \"Who posts the least relevant answer to X's question?\" / \"Who gave the most relevant response \u2026?\" |\n| EN-10 | Chart & data | \"Which conclusion is most strongly supported by the data?\" / \"Which statement best evaluates the differences between categories?\" / \"Which of the following best explains the disparity between \u2026 and \u2026?\" |\n\nOpsi untuk soal \"Who \u2026?\" = 5 nama poster. Distraktor = poster lain yang cocok **sebagian** (mis. menyebut hal yang sama tanpa bukti).\n\n### C4. Cloze grammar (bagian D, 8 titik)\n**5 titik \"bentuk kata\"**: opsi = satu kata dasar dalam 5 bentuk (adopt / adopting / adopted / adopts / adoption). Pilih dari:\n| Label | Poin | Contoh |\n|---|---|---|\n| G-01 | Present perfect (have/has + V3) | Many companies have **adopted** \u2026 |\n| G-01 | Modal + V1 | must **develop**, can **adapt** |\n| G-01 | Passive with modal (modal + be + V3) | it can be clearly **seen** that \u2026 |\n| G-01 | Subject\u2013verb agreement | The bar chart **shows** \u2026; 40 percent of individuals **use** \u2026 |\n| G-01 | Verb pattern (to + V1, force sb to V1) | struggle to **maintain** |\n| G-02 | Participle clause | \u2026, **reaching** approximately 95 percent |\n| G-02 | Comparative (jebakan: more higher, the most higher) | slightly **higher than** |\n| G-02 | Word form setelah article/adjective | a further **reduction** |\n\n**3 titik \"makna\"**: opsi berupa 5 kata dengan bentuk yang sama tetapi makna berbeda (ignore / reject / explore / remove / avoid). Jawaban ditentukan oleh konteks atau data di kalimat lain.\n| Label | Poin | Contoh |\n|---|---|---|\n| G-03 | Vocabulary from context | forced organizations to **explore** alternative models |\n| G-03 | Arah tren sesuai data | usage **declines** gradually with age |\n| G-03 | Collocation | have a significant **impact** on |\n\n### C5. Catatan khas Literasi Inggris\n- Tidak ada soal pengetahuan di luar teks. Jebakan lebih banyak di level kata (D7, D10, D12).\n- Paraphrase harus memakai sinonim akademik (constantly \u2192 continuous, how can \u2192 finding ways, feasibility \u2192 practicality).\n- Opsi restatement: hanya satu yang mempertahankan makna **dan** modalitas kalimat asli.\n\n---\n\n## BAGIAN D \u2014 SKEMA JSON (untuk web)\n\n```json\n{\n  \"paket_id\": \"LBIND-001\",\n  \"subtes\": \"LBIND\",\n  \"judul_paket\": \"Paket 1\",\n  \"teks\": [\n    {\n      \"id\": \"T1\",\n      \"slot\": \"sains\",\n      \"jenis\": \"artikel\",\n      \"judul\": \"\u2026\",\n      \"paragraf\": [\"\u2026\", \"\u2026\"],\n      \"tabel\": { \"judul\": \"\u2026\", \"kolom\": [\"\u2026\", \"\u2026\"], \"baris\": [[\"\u2026\", \"\u2026\"]], \"catatan\": \"(data ilustrasi)\" },\n      \"sumber\": \"(Diadaptasi dari berbagai sumber)\"\n    }\n  ],\n  \"soal\": [\n    {\n      \"no\": 1,\n      \"teks_id\": \"T1\",\n      \"label\": \"ID-01\",\n      \"level\": \"LOTS\",\n      \"format\": \"biasa\",\n      \"stem\": \"\u2026\",\n      \"opsi\": { \"A\": \"\u2026\", \"B\": \"\u2026\", \"C\": \"\u2026\", \"D\": \"\u2026\", \"E\": \"\u2026\" },\n      \"kunci\": \"C\",\n      \"bukti\": { \"paragraf\": 2, \"kutipan\": \"\u2026\" },\n      \"pembahasan\": \"\u2026\",\n      \"distraktor\": { \"A\": \"D2: \u2026\", \"B\": \"D1: \u2026\", \"D\": \"D6: \u2026\", \"E\": \"D4: \u2026\" }\n    }\n  ]\n}\n```\n\nVariasi field `teks` per jenis:\n- `\"jenis\": \"puisi\"` \u2192 `\"bait\": [[\"larik\", \"larik\"], [\"\u2026\"]]`\n- `\"jenis\": \"thread\"` \u2192 `\"posts\": [{ \"nama\": \"\u2026\", \"tanggal\": \"\u2026\", \"isi\": \"\u2026\" }]` (post pertama = pembuka)\n- `\"jenis\": \"paired\"` \u2192 `\"passages\": [{ \"label\": \"Text 1\", \"paragraf\": [\"\u2026\"] }, { \"label\": \"Text 2\", \"paragraf\": [\"\u2026\"] }]`\n- `\"jenis\": \"chart\"` \u2192 `\"grafik\": { \"tipe\": \"bar\", \"judul\": \"\u2026\", \"label\": [\"\u2026\"], \"nilai\": [0], \"satuan\": \"%\" }`\n- `\"jenis\": \"cloze\"` \u2192 paragraf memuat penanda `{{n}}` di posisi titik kosong. Soalnya memakai `\"format\": \"blank\"` dan `\"stem\": \"(n) \u2026\u2026\"`.\n\n`format`: `\"biasa\"` | `\"kecuali\"` | `\"blank\"`. `level`: `\"LOTS\"` | `\"MOTS\"` | `\"HOTS\"`.\n\nField tambahan di setiap objek `teks`:\n- `\"asal\": \"artikel\"` (dari artikel yang ditempel) atau `\"asal\": \"buatan\"` (ditulis mengikuti file 03).\n- `\"koreksi\": [{ \"paragraf\": 2, \"semula\": \"\u2026\", \"menjadi\": \"\u2026\", \"alasan\": \"\u2026\" }]`, hanya untuk `asal: \"artikel\"`. Isi `[]` kalau tidak ada koreksi.\n- `\"sumber\"`: untuk artikel, tulis \"(Diadaptasi dari <media>, <tautan>)\". Untuk teks buatan, tulis \"(Teks orisinal untuk latihan)\". Kalau ada data ilustrasi, tambahkan \"; data ilustrasi\".\n\n---\n\n## BAGIAN E \u2014 MODE ARTIKEL ASLI (/ARTIKEL)\n\n### E1. Prinsip\n- Artikel dipakai **utuh**: semua paragraf, sepanjang apa pun. Panjang teks melatih daya tahan membaca, jadi tidak ada pemotongan, peringkasan, atau penggabungan paragraf.\n- **Paragraf** = blok yang dipisahkan baris kosong di teks yang ditempel, diberi nomor 1, 2, 3, \u2026. Subjudul di dalam artikel tidak diberi nomor paragraf. Subjudul disimpan sebagai paragraf yang diawali `## ` agar web bisa menampilkannya sebagai subjudul.\n- Kalimat iklan, \"Baca juga: \u2026\", keterangan foto, ajakan berlangganan, dan teks navigasi situs **dibuang**. Ini satu-satunya penghapusan yang diizinkan. Setiap penghapusan dicatat di tabel koreksi dengan alasan \"bukan bagian isi artikel\".\n\n### E2. Koreksi EYD V (hanya artikel berbahasa Indonesia)\nYang **boleh** dikoreksi:\n- Ejaan kata tidak baku menjadi baku sesuai KBBI (*resiko* \u2192 *risiko*, *praktek* \u2192 *praktik*, *analisa* \u2192 *analisis*, *merubah* \u2192 *mengubah*, *diantara* \u2192 *di antara*, *kedepan* \u2192 *ke depan*).\n- Penulisan *di-/ke-* sebagai awalan dan kata depan; partikel *pun*, *-lah*, *-kah*; kata ulang; gabungan kata.\n- Huruf kapital, huruf miring untuk istilah asing yang belum diserap, dan penulisan angka, satuan, mata uang, dan persen (*Rp1.000.000*, *2,5 persen* atau *2,5%*, *5 km*).\n- Tanda baca: koma setelah konjungsi antarkalimat (*Namun,* *Oleh karena itu,*), tanda petik, titik dua, tanda pisah, dan elipsis.\n- Struktur serapan terjemahan yang melanggar kaidah, **tanpa mengubah makna**:\n  - *di mana / yang mana* sebagai kata penghubung \u2192 *tempat*, *yang*, atau kalimat dipecah\n  - *daripada* yang salah pakai \u2192 *dari* atau *ketimbang*\n  - kalimat tanpa subjek karena preposisi di awal (*Bagi warga yang \u2026 maka \u2026* \u2192 *Warga yang \u2026 *)\n  - pleonasme (*sangat \u2026 sekali*, *para \u2026 -para*, *agar supaya*)\n  - *hal ini dikarenakan* \u2192 *hal ini disebabkan oleh* / *karena*\n  - *merupakan salah satu dari* \u2192 *merupakan salah satu*\n\nYang **tidak boleh**: mengganti kata yang sudah baku dengan sinonimnya, mengubah urutan informasi, menambah atau mengurangi informasi, memperhalus gaya, atau \"memperbaiki\" opini penulis.\n\nKalau sebuah kalimat terjemahan terlalu rusak sehingga koreksi tata bahasa pasti mengubah susunannya, ubah seminimal mungkin, lalu tandai di tabel dengan alasan \"struktur kalimat diperbaiki\" agar bisa dicek.\n\n### E3. Menyusun soal dari artikel panjang\n- Bukti setiap soal tetap menunjuk satu paragraf (`bukti.paragraf`).\n- Sebarkan soal ke seluruh artikel: awal, tengah, dan akhir. Jangan menumpuk di 3 paragraf pertama.\n- Artikel panjang boleh mendapat 1 soal ekstra (maksimal 6 soal per teks), asalkan total paket tetap 25/20. Kurangi soal dari teks lain untuk mengimbanginya.\n- Soal gagasan utama untuk artikel panjang menanyakan **paragraf tertentu** atau **bagian tertentu** (\"paragraf 6\u20138\"), selain gagasan utama keseluruhan.\n\n### E4. Slot terkunci\nPeriksa setiap artikel terhadap ciri wajib slotnya (Bagian B1/C1). Kalau ciri itu tidak ada, misalnya slot T2 tanpa tabel:\n1. Kalau artikel memuat angka yang cukup, buat **tabel \"diolah dari teks\"** dari angka-angka tersebut (aturannya di file 03, Bagian 6). Isi artikel tetap tidak diubah.\n2. Kalau tidak bisa, ganti tipe soalnya dengan tipe lain yang masih ada di blueprint teks itu, lalu catat di \"Slot terkunci\".\n3. Slot yang memang tidak bisa diisi dari artikel (sastra, thread, teks berpasangan kedua, teks + grafik) **dibuat** mengikuti file 03.\n", R03="# PANDUAN TEKS BUATAN \u2014 Menulis Teks Literasi yang Terasa Ditulis Manusia\n\nDipakai ketika sebuah slot tidak punya artikel asli, misalnya teks sastra, thread forum, teks kedua dari pasangan teks, teks dengan grafik, atau tabel pendamping. Ikuti tahapan setiap jenis teks **secara berurutan**. Jangan langsung menulis sebelum tahap perencanaan selesai.\n\n---\n\n## BAGIAN 1 \u2014 PRINSIP UMUM\n\n### 1.1 Mulai dari soal, bukan dari teks\nTeks UTBK dibuat supaya bisa diuji. Sebelum menulis, tentukan dulu tipe soal yang akan dibuat dari teks itu (dari blueprint di file 02), lalu **tanamkan bahan ujinya** di dalam teks:\n| Tipe soal yang direncanakan | Yang harus ditanam di teks |\n|---|---|\n| Informasi tersurat | 1 kalimat yang menyatakan sebab, tujuan, atau definisi secara jelas |\n| Makna istilah/kata | 1 istilah teknis atau kata bermakna ganda yang maknanya bisa ditarik dari kalimat di sekitarnya |\n| Inferensi/prediksi | Kecenderungan atau tren yang tidak disimpulkan sendiri oleh penulis |\n| Asumsi | Sebuah kebijakan atau saran yang punya dasar pemikiran tersirat |\n| Penerapan konsep | Kriteria atau klasifikasi yang jelas (tahap, jenis, kategori) |\n| Evaluasi teks | Satu kelemahan wajar: klaim tanpa data pembanding, atau satu sisi yang tidak dibahas |\n| Data/hitungan | Angka yang bisa dibandingkan, dijumlahkan, atau dipersentasekan |\n| Sikap penulis / opini | 1 kalimat penilaian penulis yang tidak netral, ditempatkan di tengah teks |\n| Referensi (EN) | Kata ganti (*they, it, their, this*) yang punya dua calon rujukan masuk akal |\n\n### 1.2 Tanda teks buatan mesin yang harus dihindari\n**Bahasa Indonesia:**\n- Pembuka klise: *Di era digital ini\u2026*, *Seiring perkembangan zaman\u2026*, *Tak dapat dimungkiri\u2026*, *Dewasa ini\u2026*\n- Kata yang dipakai berlebihan: *krusial, signifikan, lanskap, ekosistem* (di luar konteks biologi), *memainkan peran penting, menjadi kunci, tak terpisahkan*\n- Pola tiga serangkai di setiap kalimat (*cepat, tepat, dan akurat*)\n- Penutup berupa nasihat umum: *Dengan demikian, sudah saatnya kita semua\u2026*, *Oleh karena itu, diperlukan sinergi berbagai pihak\u2026*\n- Pertanyaan retoris di awal paragraf, dan tanda pisah (\u2014) yang dipakai berkali-kali\n- Semua paragraf sama panjang dan semua kalimat sama panjang\n\n**Bahasa Inggris:**\n- *In today's fast-paced world, delve into, tapestry, navigate the complexities, it is worth noting that, plays a pivotal role, a testament to, game-changer*\n- Penutup *In conclusion, \u2026* yang mengulang isi\n- Kalimat bertingkat yang terlalu rapi di semua paragraf\n\n### 1.3 Ciri teks yang terasa ditulis manusia\n- **Spesifik:** angka (*1.200 responden*, *naik dari 14 menjadi 19 persen*), tempat (*di tiga kabupaten di Nusa Tenggara Timur*), waktu (*sejak 2019*), dan contoh konkret di setiap paragraf.\n- **Panjang kalimat bervariasi:** satu kalimat pendek di antara kalimat panjang.\n- **Satu sudut pandang yang jelas:** artikel populer punya arah, tidak sekadar daftar fakta.\n- **Sumber disebut wajar:** *menurut survei Badan Pusat Statistik*, *sebuah studi di jurnal Nature*, *seorang peneliti gizi di Yogyakarta*. **Jangan** mengarang kutipan langsung dari tokoh nyata yang bernama. Pakai peran (*seorang petani*, *kepala sekolah di Sleman*) atau tokoh fiktif.\n- **Penutup yang tidak menggurui:** akhiri dengan fakta, implikasi, atau pertanyaan terbuka yang muncul dari isi.\n\n### 1.4 Kaidah EYD V wajib (teks Indonesia)\n- Kata baku KBBI: *risiko, praktik, analisis, sistem, kualitas, efektif, objek, aktivitas, apotek, hakikat, napas, nasihat, kreativitas*.\n- *di-* sebagai awalan disambung (*dikirim*), *di* sebagai kata depan dipisah (*di sekolah*). Hal yang sama berlaku untuk *ke-*.\n- Hindari *di mana / yang mana* sebagai penghubung. Hindari *daripada* untuk makna \"dari\".\n- Konjungsi antarkalimat diikuti koma (*Namun, \u2026* *Akibatnya, \u2026*).\n- Penulisan angka: *Rp2.500*, *3,4 persen*, *tahun 2024*, *abad ke-20*, *1.200 orang*. Angka di awal kalimat ditulis dengan huruf.\n- Istilah asing yang belum diserap dicetak miring: *passion project*, *scarcity marketing*.\n- Setiap kalimat punya subjek dan predikat. Hindari kalimat yang diawali preposisi tanpa subjek.\n\n### 1.5 Topik yang sesuai konsep UTBK\nPilih topik yang **menghubungkan sains atau sosial dengan kehidupan nyata Indonesia**, sesuai pola KatKiel, TO MIPY, dan Inten:\n- **Sains:** kimia sehari-hari (garam, logam berat, gula darah), fisika fenomena (orbit, listrik, gelombang), biologi (parasit, enzim, imunisasi), bumi dan iklim (ENSO, albedo, peta kontur).\n- **Sosial-ekonomi:** harga pangan, ekspor-impor, pengangguran, ekonomi digital, pajak, redenominasi, perilaku konsumen.\n- **Sejarah/humaniora:** kerajaan Nusantara, manusia purba Indonesia, pergerakan nasional, teori sosiologi klasik (Comte, Durkheim).\n- **Kesehatan/lingkungan/kebijakan:** penyakit menular, obat herbal, program pemerintah, tambang, sampah, energi.\n- **Inggris:** riset sains terbaru, bisnis dan pemasaran, kesehatan, pendidikan, budaya dan komunikasi, kebijakan publik.\n\n---\n\n## BAGIAN 2 \u2014 PUISI ORISINAL (slot T5 Indonesia)\n\n**Tahap 1 \u2014 Rencana (tulis dulu, jangan ditampilkan):**\n1. Tema sosial atau batin yang konkret (kota dan kelelahan, alam yang rusak, kampung yang ditinggal, bahasa, ibu, kerja).\n2. Satu **citraan pusat** yang menjadi poros puisi (halte, sungai, lampu jalan, sawah).\n3. **Perubahan suasana** antarbait, misalnya resah \u2192 pasrah \u2192 berharap. Ini bahan soal suasana dan perubahannya.\n4. Majas yang ditanam (**minimal 3 jenis berbeda**): personifikasi, simile, metafora, repetisi, hiperbola, paradoks, atau ironi. Setiap majas ditempatkan pada larik yang bisa dikutip.\n5. Amanat yang **tersirat**, tidak diucapkan langsung.\n\n**Tahap 2 \u2014 Menulis:**\n- 3\u20135 bait, 3\u20136 larik per bait. Larik bebas, dan rima tidak wajib.\n- Diksi konkret (benda, warna, bunyi). Hindari kata abstrak beruntun (*cinta, rindu, harapan, kehidupan*) tanpa gambaran.\n- Sisipkan **satu larik yang ambigu secara wajar**. Larik ini menjadi bahan soal \"makna larik\".\n- Hindari klise: *senja jingga merona, rembulan tersenyum, hati yang hancur berkeping-keping*.\n\n**Tahap 3 \u2014 Cek:** setiap soal sastra yang direncanakan harus punya larik bukti. Kalau ada soal tanpa larik bukti, revisi puisinya, bukan soalnya.\n\n## BAGIAN 3 \u2014 KUTIPAN PROSA ORISINAL (alternatif slot T5)\n\n1. **Rencana:** satu tokoh utama dengan **konflik batin** (pulang atau tetap merantau, jujur atau aman, ambisi orang tua atau keinginan sendiri). Tentukan watak lewat tindakan, bukan lewat label.\n2. **Struktur 250\u2013450 kata:** pembukaan latar (2\u20133 kalimat), adegan dengan dialog pendek (2\u20134 baris), reaksi tokoh lain, dan akhir yang terbuka.\n3. Tanamkan: satu tindakan tokoh yang alasannya tersirat (soal \"alasan tokoh \u2026\"), satu majas, satu kalimat yang menunjukkan watak, dan satu reaksi orang sekitar.\n4. Dialog memakai ragam lisan yang wajar, tetapi narasinya tetap baku EYD V.\n5. Di bawah teks: \"(Kutipan cerpen orisinal untuk latihan)\".\n\n## BAGIAN 4 \u2014 THREAD FORUM (bagian A LBE)\n\n1. **Pertanyaan pembuka (OP):** satu masalah personal yang jelas, 2\u20133 kalimat, dan diakhiri pertanyaan \"How \u2026?\" atau \"What should I do \u2026?\". Sebutkan satu kondisi khusus (*I'm diabetic*, *I live in a small apartment*) agar bisa muncul soal \"jawaban yang paling relevan\".\n2. **5\u20136 balasan dengan peran wajib**, yang urutannya diacak:\n   | Peran | Bahan soal |\n   |---|---|\n   | Tip + **bukti** (pengalaman atau hasil terukur) | \"Who provides a tip \u2026 by giving evidence?\" |\n   | Tip tanpa bukti | distraktor untuk soal bukti |\n   | **Tidak setuju** secara eksplisit (*Honestly, I don't think \u2026*) | \"Who explicitly suggests \u2026?\" |\n   | **Tidak relevan** (iklan, promosi, atau keluar topik) | \"least relevant answer\" |\n   | Menjawab kondisi khusus OP | \"most relevant response\" |\n   | Empati atau menenangkan | soal tone |\n3. Nama beragam (Barat, Asia, nama pengguna seperti *Switchdm*), tanggal urut maju dalam rentang 1\u20134 minggu.\n4. Register: kasual dan wajar (*Honestly, Tbh, I'd say*), kontraksi boleh, tetapi tata bahasanya benar dan tanpa salah ketik.\n5. Tanamkan **satu kata bermakna kuat** di salah satu balasan (*disgusting, eliminate, associate*) untuk soal vocabulary.\n\n## BAGIAN 5 \u2014 TEKS BERPASANGAN (bagian B LBE, atau teks kedua dari satu artikel)\n\n1. **Pilih hubungan** di awal: masalah \u2194 solusi, konsep umum \u2194 penerapan khusus, pendukung \u2194 pengkritik, atau konsep A \u2194 konsep B. Ini menjadi kunci soal \"relationship\".\n2. Kalau Text 1 berasal dari artikel asli, Text 2 dibuat untuk **melengkapi hubungan itu**. Text 2 tidak boleh mengulang isinya.\n3. Masing-masing 2\u20134 paragraf, 150\u2013250 kata. Kedua teks memakai **istilah kunci yang sama** agar bisa disintesis.\n4. Tanamkan:\n   - satu kalimat opini dan satu kalimat sikap negatif penulis (soal attitude/opinion)\n   - satu kata ganti dengan dua calon rujukan (soal reference)\n   - satu informasi yang muncul di **paragraf dengan nomor yang sama** di kedua teks (soal \"information can be found in \u2026\")\n   - satu kecenderungan yang belum disimpulkan (soal prediksi/rekomendasi)\n\n## BAGIAN 6 \u2014 TABEL ATAU GRAFIK PENDAMPING\n\n**A. Diolah dari teks** (artikel asli memuat angka):\n- Ambil **hanya angka yang ada di artikel**, lalu susun ulang menjadi tabel. Jangan menambah angka baru.\n- Judul tabel diberi keterangan \"(diolah dari teks)\".\n\n**B. Data ilustrasi** (teks buatan):\n- 3\u20136 kategori dengan pola yang **bisa diuji**: satu kecenderungan utama (naik/turun), satu pengecualian, dan satu selisih terbesar yang jelas.\n- Angka dibulatkan wajar dan saling konsisten (persentase berjumlah masuk akal, nilai per satuan cocok bila dihitung).\n- Judul tabel diberi keterangan \"(data ilustrasi)\".\n- Untuk grafik LBE: simpan sebagai field `grafik` (label, nilai, satuan). Paragraf pengantar 1\u20132 paragraf tidak boleh membocorkan kesimpulan yang ditanyakan.\n\n## BAGIAN 7 \u2014 TEKS RUMPANG (bagian D LBE)\n\n1. Kalau ada artikel Inggris dari pengguna: ambil **3\u20135 paragraf berurutan** dari artikel itu, lalu kosongkan 8 kata **tanpa mengubah kata lain**.\n2. Kalau tidak ada: tulis teks 3\u20135 paragraf (deskripsi grafik, berita singkat, atau teks eksposisi).\n3. Pilih kata yang dikosongkan sesuai kebutuhan blueprint (file 02, Bagian C4): 5 titik bentuk kata dan 3 titik makna. Tidak boleh ada dua titik berurutan dalam satu kalimat.\n4. Setiap titik harus bisa dijawab dari konteks kalimatnya atau kalimat sesudahnya, dan tidak ada opsi kedua yang sama-sama berterima. Contohnya, *take notes* dan *make notes* tidak boleh muncul bersama sebagai opsi.\n\n---\n\n## BAGIAN 8 \u2014 CEK AKHIR TEKS BUATAN\nSebelum menulis soal, cek teks buatan:\n- [ ] Tidak ada frasa dari daftar 1.2.\n- [ ] Setiap paragraf punya minimal satu detail spesifik.\n- [ ] Semua bahan uji dari tahap rencana tertanam dan bisa dikutip.\n- [ ] Teks Indonesia lolos kaidah 1.4.\n- [ ] Tidak ada kutipan karangan dari tokoh nyata. Data ilustrasi diberi label.\n- [ ] Field `asal` bernilai `\"buatan\"` di JSON.\n";
const COVERS=["#6E8B74","#6F7F9C","#9A7B5F","#7D6E93","#5F8C8C","#8C6F6F","#7C8A5A"];
let DB=null,SAMPLE=null,UID=null,OWNER=false,REMOTE=[],DB_READY=false;
const localPaket=()=>LS.get("rb-paket",[]);
function refreshPaket(){
  const seen=new Set(),out=[];
  [...REMOTE.map(p=>({...p,_src:HOSTED?"repo":"db"})),...localPaket().map(p=>({...p,_src:"local"})),...SAMPLES.map(p=>({...p,_src:"contoh"}))].forEach(p=>{if(!seen.has(p.paket_id)){seen.add(p.paket_id);out.push(p)}});
  PAKET=out;
}
async function savePaket(p){
  p.warna=p.warna||COVERS[Math.abs([...p.paket_id].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%COVERS.length];

function splitParas(txt){

/* ===== PROMPT ===== */
const SOAL_SHAPE=`{"no":1,"label":"ID-01","level":"LOTS|MOTS|HOTS","format":"biasa|kecuali|blank","stem":"…","opsi":{"A":"…","B":"…","C":"…","D":"…","E":"…"},"kunci":"C","bukti":{"paragraf":2,"kutipan":"…"},"pembahasan":"…","distraktor":{"A":"D2: …","B":"D1: …","D":"D6: …","E":"D4: …"}}`;
function buildPrompt(sub,sl,input){
  const head=`Kamu penyusun soal Literasi UTBK-SNBT. Ikuti dua dokumen acuan berikut secara ketat.\n\n<acuan_pola_soal>\n${R02}\n</acuan_pola_soal>\n\n<panduan_teks_buatan>\n${R03}\n</panduan_teks_buatan>\n\n`;
  const task=`TUGAS\nSubtes: ${sub==="LBIND"?"Literasi dalam Bahasa Indonesia (/LBIND)":"Literasi dalam Bahasa Inggris (/LBE)"}\nSlot: ${sl.id} (${sl.slot}). Ciri wajib slot: ${sl.ciri}.\nJumlah soal: tepat ${sl.n}, dinomori 1 sampai ${sl.n}. Ikuti sebaran soal slot ini di acuan.\nPembahasan selalu dalam bahasa Indonesia.\n`;
  let body="",shape="";
  if(input.mode==="artikel"){
    const paras=input.paras.map((p,i)=>`[${i+1}] ${p}`).join("\n\n");
    body=`MODE: ARTIKEL ASLI (Bagian E). Artikel di bawah sudah dipecah per paragraf bernomor [n].\nJANGAN menyalin ulang artikel. Kembalikan hanya: judul, daftar nomor paragraf yang sebenarnya subjudul, daftar nomor paragraf yang bukan isi (iklan, "Baca juga", keterangan foto), dan daftar koreksi EYD V ${sub==="LBIND"?"(Bagian E2)":"(hanya salah ketik yang jelas)"}. Setiap "semula" harus berupa potongan teks yang PERSIS ada di paragraf itu.\nSemua nomor paragraf di jawabanmu (bukti, koreksi, subjudul, hapus, tabel.setelah) memakai nomor [n] ASLI di bawah.\nKalau ciri wajib slot tidak ada di artikel, ikuti Bagian E4 (tabel "diolah dari teks" hanya dari angka yang ada di artikel, atau ganti tipe soal) dan jelaskan di "slot_terkunci".\nSumber: ${input.sumber||"(tidak disebutkan)"}\n\n<artikel>\n${paras}\n</artikel>\n`;
    shape=`{"judul":"judul asli artikel","jenis":"artikel","subjudul":[3],"hapus":[9],"koreksi":[{"paragraf":2,"semula":"…","menjadi":"…","alasan":"…"}],"tabel":null${sl.id==="C"?',"grafik":{"tipe":"bar","judul":"… (diolah dari teks)","label":["…"],"nilai":[0],"satuan":"%"}':""},"slot_terkunci":"","soal":[${SOAL_SHAPE}]}`;
    if(sl.id==="D")body+=`\nUntuk teks rumpang: ambil 3–5 paragraf berurutan dari artikel, lalu kembalikan paragraf itu UTUH dengan 8 kata dikosongkan memakai penanda {{1}} sampai {{8}} (urutan nomor soal). Kata lain tidak boleh berubah.\n`;
    if(sl.id==="D")shape=`{"judul":"…","jenis":"cloze","paragraf":["… {{1}} …"],"sumber":"…","slot_terkunci":"","soal":[${SOAL_SHAPE.replace('"bukti":{"paragraf":2','"bukti":{"paragraf":1')}]}`;
  }else if(input.mode==="paired"){
    body=`MODE: TEKS BERPASANGAN. ${input.t1?"Text 1 berasal dari pengguna (salin UTUH tanpa mengubah kata).":"Text 1 dibuat mengikuti panduan Bagian 5."} ${input.t2?"Text 2 berasal dari pengguna (salin UTUH tanpa mengubah kata).":"Text 2 dibuat mengikuti panduan Bagian 5, melengkapi hubungan dengan Text 1."}\n${input.topik?"Topik: "+input.topik+"\n":""}${input.t1?"<text1>\n"+input.t1+"\n</text1>\n":""}${input.t2?"<text2>\n"+input.t2+"\n</text2>\n":""}Bukti soal memakai {"passage":1|2,"paragraf":n}.\n`;
    shape=`{"judul":"…","jenis":"paired","passages":[{"label":"Text 1","paragraf":["…"]},{"label":"Text 2","paragraf":["…"]}],"sumber":"…","slot_terkunci":"","soal":[${SOAL_SHAPE.replace('"bukti":{"paragraf":2','"bukti":{"passage":2,"paragraf":2')}]}`;
  }else{
    const map={T5:"puisi orisinal (Bagian 2) atau kutipan prosa orisinal (Bagian 3)",A:"thread forum (Bagian 4)",C:"teks pengantar 1–2 paragraf + grafik data ilustrasi (Bagian 6B)",D:"teks rumpang 3–5 paragraf dengan 8 titik (Bagian 7)"};
    body=`MODE: TEKS BUATAN. Tulis ${map[sl.id]||"artikel populer 4–6 paragraf, 350–550 kata"} mengikuti panduan teks buatan secara berurutan (rencana → menulis → cek). Teks harus terasa ditulis manusia dan berbahasa baku.\n${input.topik?"Topik/judul dari pengguna: "+input.topik+"\n":"Pilih topik sesuai Bagian 1.5.\n"}`;
    const jen=sl.id==="A"?`"jenis":"thread","posts":[{"nama":"…","tanggal":"…","isi":"…"}]`:sl.id==="D"?`"jenis":"cloze","paragraf":["… {{1}} …"]`:sl.id==="C"?`"jenis":"artikel","paragraf":["…"],"grafik":{"tipe":"bar","judul":"… (data ilustrasi)","label":["…"],"nilai":[0],"satuan":"%"}`:sl.id==="T5"?`"jenis":"puisi","bait":[["larik","larik"]]  (atau "jenis":"artikel","paragraf":[…] untuk prosa)`:`"jenis":"artikel","paragraf":["…"],"tabel":null`;
    shape=`{"judul":"…",${jen},"sumber":"(Teks orisinal untuk latihan)","slot_terkunci":"","soal":[${SOAL_SHAPE}]}`;
    if(sl.id==="A")body+=`Bukti soal thread: "paragraf" = nomor posting (1 = pertanyaan pembuka).\n`;
    if(sl.id==="T5")body+=`Bukti soal puisi: "paragraf" = nomor bait.\n`;
  }
  const out=`\nKELUARAN: balas HANYA satu objek JSON valid berbentuk persis seperti ini (isi sendiri nilainya):\n${shape}\nSebelum menjawab, lakukan cek mandiri dari acuan (kunci terbukti, tidak ada dua jawaban benar, sebaran huruf kunci, distraktor minimal 2 jenis).`;
  return head+task+"\n"+body+out;
}

/* ===== MERAKIT HASIL ===== */
function assembleSlot(sub,sl,input,r){
  const t={id:sl.id,slot:sl.slot,judul:String(r.judul||sl.slot),asal:"buatan",koreksi:[],sumber:r.sumber||"(Teks orisinal untuk latihan)"};
  let soal=(r.soal||[]).slice(0,sl.n);
  if(input.mode==="artikel"&&sl.id!=="D"){
    const sub2=new Set((r.subjudul||[]).map(Number)),hap=new Set((r.hapus||[]).map(Number));
    const paras=input.paras.slice(),log=[];
    (r.koreksi||[]).forEach(k=>{const i=Number(k.paragraf)-1;if(paras[i]==null||!k.semula)return;const ok=paras[i].includes(k.semula);if(ok)paras[i]=paras[i].replace(k.semula,k.menjadi??"");log.push({paragraf:Number(k.paragraf),semula:k.semula,menjadi:k.menjadi,alasan:k.alasan,diterapkan:ok})});
    const map={},out=[];let n=0;
    paras.forEach((p,i)=>{const o=i+1;if(hap.has(o)){log.push({paragraf:o,semula:p.slice(0,80)+(p.length>80?"…":""),menjadi:"(dihapus)",alasan:"bukan bagian isi artikel",diterapkan:true});return}if(sub2.has(o)){out.push("## "+p);return}map[o]=++n;out.push(p)});
    Object.assign(t,{jenis:"artikel",paragraf:out,asal:"artikel",koreksi:log,sumber:input.sumber?`(Diadaptasi dari ${input.sumber})`:"(Sumber tidak disebutkan)"});
    const remap=v=>map[Number(v)]||Number(v)||1;
    if(r.tabel&&r.tabel.kolom){t.tabel={...r.tabel,setelah:remap(r.tabel.setelah)}}
    if(r.grafik&&r.grafik.label)t.grafik=r.grafik;
    soal=soal.map(s=>({...s,bukti:{...(s.bukti||{}),paragraf:remap(s.bukti?.paragraf)}}));
  }else{
    t.jenis=r.jenis||"artikel";
    ["paragraf","bait","posts","passages","tabel","grafik"].forEach(k=>{if(r[k])t[k]=r[k]});
    if(input.mode==="artikel"&&sl.id==="D"){t.asal="artikel";t.sumber=input.sumber?`(Diadaptasi dari ${input.sumber})`:t.sumber}
    if(input.mode==="paired"&&(input.t1||input.t2))t.asal=input.t1&&input.t2?"artikel":"campuran";
  }
  t.slot_terkunci=r.slot_terkunci||"";
  return {teks:t,soal};
}
function validSlot(sl,x){
  const s=x.soal;if(!Array.isArray(s)||s.length<sl.n)return `jumlah soal ${s?.length||0} dari ${sl.n}`;
  for(const q of s){if(!q.opsi||["A","B","C","D","E"].some(k=>!q.opsi[k]))return "opsi tidak lengkap";if(!["A","B","C","D","E"].includes(q.kunci))return "kunci tidak valid"}
  const t=x.teks;if(!(t.paragraf?.length||t.bait?.length||t.posts?.length||t.passages?.length))return "teks kosong";
  return "";
}
function finalize(sub,judul,parts){
  const id=(sub==="LBIND"?"LBIND-":"LBE-")+new Date().toISOString().slice(2,10).replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,5);
  const teksA=[],soalA=[];let no=0;
  parts.forEach(({teks:t,soal})=>{
    const map={};
    soal.forEach(s=>{const old=s.no;no++;map[old]=no;soalA.push({...s,no,teks_id:t.id,format:s.format||(t.jenis==="cloze"?"blank":"biasa"),stem:t.jenis==="cloze"?`(${no}) ……`:s.stem})});
    if(t.jenis==="cloze")t.paragraf=t.paragraf.map(p=>p.replace(/\{\{(\d+)\}\}/g,(m,n)=>`{{${map[n]||n}}}`));
    teksA.push(t);
  });
  return {paket_id:id,subtes:sub,judul_paket:judul||"Paket baru",teks:teksA,soal:soalA};
}

function inputFor(sub,sl){
  const v=draft().slots[sub+sl.id]||{};
  if(sl.paired)return {mode:"paired",t1:(v.t1||"").trim(),t2:(v.t2||"").trim(),topik:v.topik,sumber:v.sumber};
  const txt=(v.txt||"").trim();
  if(txt&&!(sl.id==="A"||sl.id==="T5"))return {mode:"artikel",paras:splitParas(txt),sumber:v.sumber};
  if(txt)return {mode:"buatan",topik:"Gunakan teks dari pengguna ini apa adanya (salin utuh tanpa mengubah kata):\n"+txt,sumber:v.sumber};
  return {mode:"buatan",topik:v.topik};
}
async function runGen(){
  const d=draft(),sub=d.sub,slots=SLOTS[sub];
  GEN.running=true;GEN.ctl=new AbortController();GEN.result=null;
  slots.forEach(sl=>{if(!GEN.parts[sub+sl.id])GEN.status[sl.id]="menunggu"});vAdd();
  const queue=slots.filter(sl=>!GEN.parts[sub+sl.id]);
  const work=async()=>{while(queue.length&&!GEN.ctl.signal.aborted){const sl=queue.shift();const input=inputFor(sub,sl);
    GEN.status[sl.id]="proses sedang dibuat…";paintStatus();
    try{const r=await SAMPLE.json(buildPrompt(sub,sl,input),{modelTier:"complex",signal:GEN.ctl.signal,cache:false,onText:({text})=>{GEN.status[sl.id]=`proses menulis… ${Math.round(text.length/100)/10} rb karakter`;paintStatus()}});
      const part=assembleSlot(sub,sl,input,r),bad=validSlot(sl,part);
      if(bad){GEN.status[sl.id]="gagal "+bad}else{GEN.parts[sub+sl.id]=part;GEN.status[sl.id]="ok selesai"}

  await Promise.all([work(),work()]);

  $$("[data-tp]").forEach(el=>el.oninput=()=>{S.prepTopics=S.prepTopics||{};S.prepTopics[el.dataset.tp]=el.value});

function streak(){
  let n=0;const d=new Date();
  if(!histOn(ymd(d)).length)d.setDate(d.getDate()-1);
  while(histOn(ymd(d)).length){n++;d.setDate(d.getDate()-1)}
  return n;
}

  const week=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d});

let SESI;const getSesi=()=>SESI!==undefined?SESI:(SESI=LS.get("rb-sesi",null));
let sesiT=null;
function pushSesi(o){if(!DB||!UID)return;clearTimeout(sesiT);sesiT=setTimeout(()=>{DB.doc("data/users/"+UID+"/sesi").set(o||{kosong:true,t:Date.now()}).catch(()=>{})},1500)}
function saveSesi(){
  if(!S.pk||!(S.view==="read"||S.view==="quiz"))return;
  const p=pk();if(!p||p._src==="contoh"&&false)return;
  const o={pk:S.pk,judul:p.judul_paket,view:S.view,r:S.r,q:S.q,ans:S.ans,flag:S.flag,mode:S.mode,el:S.el+(S.view==="quiz"&&S.t0?Math.floor((Date.now()-S.t0)/1000):0),n:p.soal.length,nt:p.teks.length,t:Date.now()};

function resumeSesi(o){

  Object.assign(S,{pk:o.pk,r:o.r||0,q:o.q||0,ans:o.ans||{},flag:o.flag||{},el:o.el||0,mode:o.mode||S.mode,open:{},tab:null,saved:false,view:o.view==="quiz"?"quiz":"read",t0:Date.now()});

}
function resumeHTML(){

}

/* ===== MODE CHAT CLAUDE (salin prompt, tempel jawaban) ===== */
GEN.inputs={};
function manualHTML(sl){
  const d=draft(),ok=!!GEN.parts[d.sub+sl.id];
  return `<div class="man"><div class="man-h"><b>Lewat chat Claude</b><span>Salin prompt → tempel di chat Claude → tempel jawabannya di sini</span></div>
   <div class="row" style="justify-content:flex-start;align-items:center"><button class="btn btn-p" data-cp="${sl.id}">Salin prompt ${sl.id}</button>${ok?`<span class="hint" style="margin:0;color:var(--ok)">Jawaban ${sl.id} sudah masuk.</span>`:""}</div>
   ${ok?"":`<textarea class="imp" data-ans="${sl.id}" placeholder="Tempel jawaban JSON dari Claude untuk slot ${sl.id}"></textarea><span class="hint" data-msg="${sl.id}" style="margin:0"></span>`}</div>`;
}
function parseLoose(t){t=String(t).trim();const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f)t=f[1].trim();else{const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a>=0&&b>a)t=t.slice(a,b+1)}return JSON.parse(t)}
function bindManual(){
  const d=draft(),sub=d.sub,slots=SLOTS[sub];
  $$("[data-cp]").forEach(b=>b.onclick=async()=>{
    const sl=slots.find(x=>x.id===b.dataset.cp),input=inputFor(sub,sl);GEN.inputs[sub+sl.id]=input;
    const prompt=buildPrompt(sub,sl,input),o=b.textContent;
    try{await navigator.clipboard.writeText(prompt);b.textContent="Prompt tersalin";setTimeout(()=>b.textContent=o,1800)}
    catch(e){overlay(`<h3>Prompt ${esc(sl.id)}</h3><p>Salin semua isi kotak ini, lalu tempel di chat Claude.</p><textarea class="imp" id="pt" style="min-height:240px" readonly>${esc(prompt)}</textarea><div class="row" style="margin-top:10px"><button class="btn btn-p" id="cx">Tutup</button></div>`,()=>{const t=$("#pt");t.focus();t.select();$("#cx").onclick=closeOv})}
  });
  $$("[data-ans]").forEach(ta=>{let tm=null;ta.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{
    const id=ta.dataset.ans,sl=slots.find(x=>x.id===id),msg=$(`[data-msg="${id}"]`);
    if(!ta.value.trim()){msg.textContent="";return}
    let r;try{r=parseLoose(ta.value)}catch(e){msg.textContent="Belum terbaca sebagai JSON. Pastikan seluruh jawaban Claude ikut tersalin.";msg.style.color="var(--no)";return}
    const input=GEN.inputs[sub+id]||inputFor(sub,sl),part=assembleSlot(sub,sl,input,r),bad=validSlot(sl,part);
    if(bad){msg.textContent="Jawaban belum lengkap: "+bad+". Minta Claude melengkapinya, lalu tempel ulang.";msg.style.color="var(--no)";return}
    GEN.parts[sub+id]=part;GEN.status[id]="ok selesai";
    if(slots.every(x=>GEN.parts[sub+x.id])){GEN.result=finalize(sub,d.judul,slots.map(x=>GEN.parts[sub+x.id]));GEN.result.tanggal=d.tanggal||ymd(new Date())}
    vAdd();
  },350)}});
}

<div class="hf" id="hf" data-side="right">
  <div class="hf-veil" id="hfVeil" hidden></div>
  <div class="hf-ring" id="hfRing" role="menu" aria-label="Pintasan app" hidden><div class="hf-grid" id="hfGrid"></div></div>
  <button type="button" class="hf-dot" id="hfDot" aria-label="Lumi: buka pintasan app" aria-expanded="false" aria-controls="hfRing">
    <svg class="hf-lumi" viewBox="12 4 86 98" aria-hidden="true">
      <defs><radialGradient id="hfLumiG" cx="40%" cy="32%" r="75%"><stop offset="0" stop-color="#FFC9A3"/><stop offset=".6" stop-color="#FF9F66"/><stop offset="1" stop-color="#F57F45"/></radialGradient></defs>
      <g class="hf-bob">
        <path d="M55 26c24 0 38 16 38 38 0 20-15 33-38 33S17 84 17 64c0-22 14-38 38-38z" fill="url(#hfLumiG)"/>
        <g class="hf-leaf"><path d="M55 27c0-8 1-13 3-17" stroke="#2E9E6A" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M58 12c7-6 16-5 19-1-5 6-13 7-19 1z" fill="#4CC38A"/><path d="M56 15c-6-5-14-4-17 0 5 5 12 5 17 0z" fill="#6ED6A2"/></g>
        <g class="hf-eyes"><ellipse cx="42" cy="58" rx="4.6" ry="5.8" fill="#2B2340"/><ellipse cx="68" cy="58" rx="4.6" ry="5.8" fill="#2B2340"/><circle cx="43.6" cy="55.8" r="1.7" fill="#fff"/><circle cx="69.6" cy="55.8" r="1.7" fill="#fff"/></g>
        <path class="hf-happy" d="M37 60q5-7 10 0M63 60q5-7 10 0" stroke="#2B2340" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        <ellipse cx="34" cy="68" rx="5.5" ry="3.4" fill="#FF6F8A" opacity=".5"/><ellipse cx="76" cy="68" rx="5.5" ry="3.4" fill="#FF6F8A" opacity=".5"/>
        <path class="hf-smile" d="M49 70q6 6 12 0" stroke="#2B2340" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path class="hf-grin" d="M47 68q8 11 16 0z" fill="#2B2340"/>
        <ellipse class="hf-o" cx="55" cy="72" rx="3.6" ry="4.4" fill="#2B2340"/>
      </g>
    </svg>
  </button>
</div>
<script>
(function(){
  var BASE='https://faiqdk07-tech.github.io/';
  var APPS=[
    {k:'progres-harian',l:'Progres',s:'Jadwal harian',t:'PH',c:'linear-gradient(135deg,#3DD07B,#1FA855)',h:'progres-harian/#hari-ini'},
    {k:'latihan-kuantitatif',l:'Kuantitatif',s:'PU · PK · PM',t:'LK',c:'linear-gradient(135deg,#FF8E78,#EE5E4A)',h:'latihan-kuantitatif/'},
    {k:'latihan-ppu-pbm',l:'PPU & PBM',s:'Kebahasaan',t:'PB',c:'linear-gradient(135deg,#34C3B3,#1C9486)',h:'latihan-ppu-pbm/'},
    {k:'vocab-lab',l:'Vocab Lab',s:'Kosakata',t:'VL',c:'linear-gradient(135deg,#3B8BFF,#5B5BE0)',h:'vocab-lab/'},
    {k:'ruang-baca',l:'Ruang Baca',s:'Literasi',t:'RB',c:'linear-gradient(135deg,#FFC24D,#F08A1C)',h:'ruang-baca/'}
  ];
  var hf=document.getElementById('hf'), dot=document.getElementById('hfDot'), ring=document.getElementById('hfRing'), veil=document.getElementById('hfVeil'), grid=document.getElementById('hfGrid');
  var here=(location.pathname.split('/').filter(Boolean)[0]||'').toLowerCase();
  grid.innerHTML=APPS.map(function(a){ var cur=here===a.k; return '<a role="menuitem" class="hf-app" href="'+BASE+a.h+'"'+(cur?' aria-current="page"':'')+'><span class="hf-logo" style="background:'+a.c+'">'+a.t+'</span><span class="hf-t">'+a.l+'</span><span class="hf-s">'+(cur?'Sedang dibuka':a.s)+'</span></a>'; }).join('');
  var KEY='hubfab.pos', pos={side:'right',y:0.62};
  try{ var p=JSON.parse(localStorage.getItem(KEY)||'null'); if(p&&(p.side==='left'||p.side==='right')&&p.y>0&&p.y<1) pos=p; }catch(e){}
  function clampY(px){ return Math.max(80,Math.min(window.innerHeight-140,px)); }
  function place(){ var y=clampY(pos.y*window.innerHeight); hf.dataset.side=pos.side; hf.style.setProperty('--hf-y',y+'px');
    hf.style.setProperty('--hf-ry',Math.max(12,Math.min(window.innerHeight-232,y-108))+'px');
    hf.style.setProperty('--hf-rx',Math.max(0,Math.min(78,window.innerWidth-300))+'px'); hf.style.setProperty('--hf-ox',pos.side==='right'?'100%':'0%'); }
  function hop(){ hf.classList.remove('hop'); void hf.offsetWidth; hf.classList.add('hop'); setTimeout(function(){ hf.classList.remove('hop'); },520); }
  function open(){ if(hf.classList.contains('open')) return; hf.classList.add('open'); hop(); ring.hidden=false; veil.hidden=false; dot.setAttribute('aria-expanded','true'); dot.setAttribute('aria-label','Lumi: tutup pintasan app'); var f=grid.querySelector('.hf-app:not([aria-current])'); if(f) f.focus({preventScroll:true}); }
  function close(){ if(!hf.classList.contains('open')) return; hf.classList.remove('open'); ring.hidden=true; veil.hidden=true; dot.setAttribute('aria-expanded','false'); dot.setAttribute('aria-label','Lumi: buka pintasan app'); }
  place(); window.addEventListener('resize',place);
  var sx=0, sy=0, moved=false, pid=null;
  dot.addEventListener('pointerdown',function(e){ pid=e.pointerId; sx=e.clientX; sy=e.clientY; moved=false; try{ dot.setPointerCapture(pid); }catch(_){} });
  dot.addEventListener('pointermove',function(e){ if(pid!==e.pointerId) return; var dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved&&Math.abs(dx)+Math.abs(dy)<8) return; if(!moved){ moved=true; close(); hf.classList.add('drag'); }
    dot.style.left=(e.clientX-31)+'px'; dot.style.right='auto'; hf.style.setProperty('--hf-y',clampY(e.clientY)+'px'); });
  function reset(){ hf.classList.remove('drag'); dot.style.left=''; dot.style.right=''; }
  dot.addEventListener('pointerup',function(e){ if(pid!==e.pointerId) return; pid=null;
    if(moved){ reset(); pos={side:e.clientX<window.innerWidth/2?'left':'right',y:clampY(e.clientY)/window.innerHeight}; try{ localStorage.setItem(KEY,JSON.stringify(pos)); }catch(_){} place(); }
    else { hf.classList.contains('open')?close():open(); } });
  dot.addEventListener('pointercancel',function(e){ if(pid===e.pointerId){ pid=null; reset(); place(); } });
  dot.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); hf.classList.contains('open')?close():open(); } });
  /* sembunyikan Lumi saat membaca atau mengerjakan soal */
  function inSession(){
    if (document.body.classList.contains('sess')) return true;
    if (document.querySelector('#frame.full')) return true;
    var els=document.querySelectorAll('.qcard, #roundHead, .sesshead, [data-hf-hide]');
    for (var i=0;i<els.length;i++){ if (els[i].getClientRects().length) return true; }
    return false;
  }
  function check(){ var off=inSession(); if (off&&pid===null) close(); if (pid===null) hf.classList.toggle('hf-off',off); }
  check(); setInterval(check,400); window.addEventListener('hashchange',function(){ setTimeout(check,0); });
  document.addEventListener('click',function(){ setTimeout(check,30); },true);
  veil.addEventListener('click',close);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
})();
</script>
</body>
</html>
